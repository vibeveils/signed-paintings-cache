plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content { includeGroup "maven.modrinth" }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// The mod this one extends. Also put on the dev runtime so ./gradlew runClient works.
	implementation "maven.modrinth:signed-paintings:${project.signed_paintings_version}"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// src/main/java/com/terraformersmc/** holds two tiny compile-only stand-ins for the Mod Menu API,
// so the optional Mod Menu button compiles without pinning a Mod Menu version. They must never ship.
jar {
	exclude "com/terraformersmc/**"
}
sourcesJar {
	exclude "com/terraformersmc/**"
}
